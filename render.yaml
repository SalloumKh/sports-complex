services:
  - type: web
    name: laravel-sports-complex
    env: php
    buildCommand: composer install --no-interaction --prefer-dist && npm install && npm run build && php artisan migrate --force
    startCommand: heroku-php-apache2 public/
    envVars:
      - key: APP_NAME
        value: "Sports Complex"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: laravel-sports-complex
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: sports_complex_db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: sports_complex_db
    ipAllowList: []